name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Pages
      uses: actions/configure-pages@v4

    # Publish only the files the site needs (not internal docs or dev tooling)
    - name: Prepare site
      run: |
        mkdir _site
        cp -r index.html favicon.ico MANUAL_USUARIO.md css js images _site/
        # Show the deployed commit in the footer
        sed -i "s|<span id=\"appVersion\">dev</span>|<span id=\"appVersion\">${GITHUB_SHA::7}</span>|" _site/index.html
        grep -q "appVersion\">${GITHUB_SHA::7}<" _site/index.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4