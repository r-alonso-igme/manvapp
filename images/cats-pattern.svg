<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <!-- Repeating tile of black cat faces with glowing eyes, inspired by the club shirt.
       The tile is drawn with its 8 neighbours so cats crossing an edge continue seamlessly. -->
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.55" stop-color="#f6c21c"/>
      <stop offset="1" stop-color="#e8641a"/>
    </radialGradient>
    <g id="cat">
      <path d="M-42,-8 L-38,-58 L-10,-34 Z M42,-8 L38,-58 L10,-34 Z" fill="url(#fur)" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-35,-18 L-33,-48 L-17,-34 Z M35,-18 L33,-48 L17,-34 Z" fill="#2b1f1f"/>
      <ellipse rx="46" ry="40" fill="url(#fur)" stroke="#333" stroke-width="1.5"/>
      <ellipse cx="-18" cy="-4" rx="11" ry="8" fill="url(#eye)"/>
      <ellipse cx="18" cy="-4" rx="11" ry="8" fill="url(#eye)"/>
      <ellipse cx="-18" cy="-4" rx="2.5" ry="7" fill="#000"/>
      <ellipse cx="18" cy="-4" rx="2.5" ry="7" fill="#000"/>
      <circle cx="-15" cy="-7" r="1.6" fill="#fff" opacity="0.8"/>
      <circle cx="21" cy="-7" r="1.6" fill="#fff" opacity="0.8"/>
      <path d="M-4,12 L4,12 L0,17 Z" fill="#3a2a2a"/>
      <path d="M-30,16 L-12,18 M-30,22 L-12,21 M30,16 L12,18 M30,22 L12,21" stroke="#3a3a3a" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g id="tile">
      <use xlink:href="#cat" href="#cat" transform="translate(50 60) rotate(-8) scale(1.1)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(160 55) rotate(6) scale(0.9)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(270 65) rotate(-4) scale(1.2)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(370 50) rotate(10) scale(0.85)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(100 170) rotate(5) scale(1.25)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(215 165) rotate(-10) scale(0.95)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(330 175) rotate(3) scale(1.1)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(40 280) rotate(8) scale(1.0)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(160 285) rotate(-5) scale(1.15)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(280 275) rotate(12) scale(0.9)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(380 290) rotate(-3) scale(1.05)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(95 375) rotate(-6) scale(0.9)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(220 380) rotate(4) scale(1.2)"/>
      <use xlink:href="#cat" href="#cat" transform="translate(335 370) rotate(-9) scale(0.95)"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="#0d0d0d"/>
  <use xlink:href="#tile" href="#tile" transform="translate(-400 -400)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(0 -400)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(400 -400)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(-400 0)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(0 0)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(400 0)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(-400 400)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(0 400)"/>
  <use xlink:href="#tile" href="#tile" transform="translate(400 400)"/>
</svg>
